<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pairwise Ranking Beers</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, 'Helvetica Neue', 'Segoe UI', sans-serif;
            text-align: left;
            margin: 0 auto;
            max-width: 700px;
            padding: 0 16px 40px;
            background: #000;
            color: #f5f5f7;
            font-weight: 300;
            letter-spacing: 0.01em;
        }
        h1 {
            margin-bottom: 4px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }
        h3 {
            font-weight: 500;
            color: #e0e0e5;
        }
        p {
            color: #8e8e93;
        }
        #beerImage {
            width: 80px;
            margin: 24px 0 8px;
            border-radius: 8px;
        }

        /* Progress Bar */
        #progressContainer {
            display: none;
            margin: 16px 0;
            background: rgba(255,255,255,0.08);
            border-radius: 12px;
            overflow: hidden;
            height: 28px;
            position: relative;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        #progressBar {
            height: 100%;
            background: linear-gradient(90deg, #0a84ff, #5e5ce6);
            border-radius: 12px;
            transition: width 0.35s ease;
            width: 0%;
        }
        #progressText {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 500;
            color: #f5f5f7;
            letter-spacing: 0.02em;
        }

        /* Selection Form */
        .selection-section {
            margin-bottom: 20px;
        }
        #beerSelectionForm {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 16px;
        }
        #beerSelectionForm label {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        #beerSelectionForm label:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.2);
        }
        #beerSelectionForm label:has(input:checked) {
            background: rgba(255,59,48,0.15);
            border-color: rgba(255,59,48,0.4);
        }
        #beerSelectionForm label img,
        #beerSelectionForm label .beer-emoji-fallback {
            width: 36px;
            height: 36px;
            object-fit: contain;
            border-radius: 6px;
            flex-shrink: 0;
        }
        .beer-emoji-fallback {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background: rgba(255,255,255,0.05);
            border-radius: 6px;
        }
        #beerSelectionForm label span {
            font-size: 14px;
            color: #f5f5f7;
        }
        #beerSelectionForm input[type="checkbox"] {
            accent-color: #ff3b30;
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }
        #startRanking {
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            background: #0a84ff;
            color: white;
            border: none;
            border-radius: 14px;
            letter-spacing: 0.01em;
            transition: all 0.2s ease;
        }
        #startRanking:hover {
            background: #0070e0;
            transform: scale(1.02);
        }
        #startRanking:active {
            transform: scale(0.98);
        }

        /* Pairwise Comparison */
        #pairwiseContainer {
            display: none;
        }
        #pairwiseContainer p {
            color: #8e8e93;
        }
        .pair {
            margin: 10px 0;
            padding: 20px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            display: flex;
            justify-content: space-around;
            align-items: stretch;
            gap: 16px;
        }
        .pair-button {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 20px 10px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            background: rgba(255,255,255,0.06);
            color: #f5f5f7;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            transition: all 0.2s ease;
        }
        .pair-button:hover {
            background: rgba(10,132,255,0.15);
            border-color: #0a84ff;
            transform: scale(1.03);
        }
        .pair-button:active {
            transform: scale(0.97);
        }
        .pair-button img,
        .pair-button .beer-emoji-fallback-lg {
            width: 80px;
            height: 80px;
            object-fit: contain;
        }
        .beer-emoji-fallback-lg {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }
        .pair-vs {
            display: flex;
            align-items: center;
            font-size: 20px;
            font-weight: 600;
            color: #48484a;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        /* Rankings */
        #beers {
            list-style: none;
            padding: 0;
        }
        #beers li {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            margin: 6px 0;
            border-radius: 12px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            transition: background 0.2s;
        }
        #beers li:nth-child(-n+3) {
            background: rgba(255,214,10,0.08);
            border-color: rgba(255,214,10,0.15);
        }
        #beers li img,
        #beers li .beer-emoji-fallback {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }
        .rank-number {
            font-weight: 600;
            min-width: 32px;
            color: #8e8e93;
        }
        #beers li:nth-child(1) .rank-number { color: #ffd60a; font-size: 20px; }
        #beers li:nth-child(2) .rank-number { color: #98989d; font-size: 18px; }
        #beers li:nth-child(3) .rank-number { color: #ac8e68; font-size: 17px; }

        #omittedBeers {
            margin-top: 20px;
        }
        #omittedList {
            list-style: none;
            padding: 0;
        }
        #omittedList li {
            padding: 8px 14px;
            margin: 4px 0;
            background: rgba(255,255,255,0.04);
            border-radius: 10px;
            color: #8e8e93;
            font-size: 14px;
        }

        /* Buttons */
        #restartButton, #shareButton {
            display: none;
            margin-top: 12px;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            border-radius: 14px;
            color: white;
            letter-spacing: 0.01em;
            transition: all 0.2s ease;
        }
        #restartButton {
            background: #0a84ff;
        }
        #restartButton:hover {
            background: #0070e0;
        }
        #shareButton {
            background: #30d158;
            margin-left: 8px;
        }
        #shareButton:hover {
            background: #28b84c;
        }
        #restartButton:active, #shareButton:active {
            transform: scale(0.97);
        }
        .button-row {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        /* Share Modal */
        #shareModal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        #shareModal.active {
            display: flex;
        }
        .share-content {
            background: #1c1c1e;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 28px;
            max-width: 440px;
            width: 90%;
            text-align: center;
        }
        .share-content h3 {
            margin-top: 0;
            color: #f5f5f7;
        }
        .share-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 16px 0;
        }
        .share-btn {
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            color: white;
            transition: all 0.2s ease;
        }
        .share-btn:active {
            transform: scale(0.97);
        }
        .share-btn.copy { background: #48484a; }
        .share-btn.copy:hover { background: #636366; }
        .share-btn.twitter { background: #1da1f2; }
        .share-btn.twitter:hover { background: #0c85d0; }
        .share-btn.facebook { background: #1877f2; }
        .share-btn.facebook:hover { background: #0d5ecf; }
        .share-btn.sms { background: #30d158; }
        .share-btn.sms:hover { background: #28b84c; }
        .share-close {
            margin-top: 10px;
            padding: 10px 24px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            background: transparent;
            color: #0a84ff;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .share-close:hover { background: rgba(255,255,255,0.06); }
        #copyConfirm {
            color: #30d158;
            font-size: 13px;
            margin-top: 4px;
            display: none;
        }
    </style>
</head>
<body>
    <!-- Beer Clip Art -->
    <img id="beerImage" src="https://www.shutterstock.com/shutterstock/photos/1497355484/display_1500/stock-vector-beer-mug-vector-clipart-design-1497355484.jpg" alt="Beer Clip Art" onerror="this.style.display='none'">

    <h1>Beers Pairwise Ranking</h1>
    <p id="introMessage">Select beers you've never tried, and they will be omitted from the rankings.</p>

    <!-- Progress Bar -->
    <div id="progressContainer">
        <div id="progressBar"></div>
        <div id="progressText">0 of 0 comparisons</div>
    </div>

    <!-- Step 1: Beer Selection -->
    <div class="selection-section">
        <h3>Select Beers You've Never Tried</h3>
        <form id="beerSelectionForm">
            <!-- Checkboxes will be added dynamically -->
        </form>
        <button id="startRanking">Start Ranking</button>
    </div>

    <!-- Step 2: Pairwise Comparison -->
    <div id="pairwiseContainer"></div>

    <!-- Final Rankings -->
    <h3 id="finalRankingHeading" style="display: none;">Final Rankings:</h3>
    <ul id="beers"></ul>

    <!-- Step 3: Omitted Beers -->
    <div id="omittedBeers" style="display: none;">
        <h3>Omitted Beers (Never Tried):</h3>
        <ul id="omittedList"></ul>
    </div>

    <!-- Action Buttons -->
    <div class="button-row">
        <button id="restartButton">Restart</button>
        <button id="shareButton">Share With Friends</button>
    </div>

    <!-- Share Modal -->
    <div id="shareModal">
        <div class="share-content">
            <h3>Share Your Rankings</h3>
            <div class="share-options">
                <button class="share-btn copy" onclick="copyRankings()">Copy to Clipboard</button>
                <p id="copyConfirm">Copied!</p>
                <button class="share-btn twitter" onclick="shareTwitter()">Share on X (Twitter)</button>
                <button class="share-btn facebook" onclick="shareFacebook()">Share on Facebook</button>
                <button class="share-btn sms" onclick="shareSMS()">Share via Text Message</button>
            </div>
            <button class="share-close" onclick="closeShareModal()">Close</button>
        </div>
    </div>

<script>
    const BEER_EMOJI = '\u{1F37A}';

    const beers = [
        {
            name: "Bud Light",
            img: "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4f/Bud_Light_can_%282023%29.png/120px-Bud_Light_can_%282023%29.png"
        },
        {
            name: "Modelo Especial",
            img: "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a0/Modelo_Especial_lata.png/100px-Modelo_Especial_lata.png"
        },
        {
            name: "Michelob Ultra",
            img: "https://upload.wikimedia.org/wikipedia/commons/thumb/3/3e/Michelob_Ultra_bottle.png/60px-Michelob_Ultra_bottle.png"
        },
        {
            name: "Coors Light",
            img: "https://upload.wikimedia.org/wikipedia/commons/thumb/7/7b/Coors_Light.png/120px-Coors_Light.png"
        },
        {
            name: "Miller Lite",
            img: "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4b/Miller_Lite_Can.png/100px-Miller_Lite_Can.png"
        },
        {
            name: "Corona Extra",
            img: "https://upload.wikimedia.org/wikipedia/commons/thumb/0/0c/Corona-6Pack.JPG/150px-Corona-6Pack.JPG"
        },
        {
            name: "Budweiser",
            img: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e2/Budweiser_new.jpg/120px-Budweiser_new.jpg"
        },
        {
            name: "Heineken",
            img: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/5d/Heineken.jpg/120px-Heineken.jpg"
        },
        {
            name: "Busch Light",
            img: "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6a/Busch_Light_can.jpg/100px-Busch_Light_can.jpg"
        },
        {
            name: "Natural Light",
            img: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/15/Natural_Light_12_FL_OZ_can.jpg/100px-Natural_Light_12_FL_OZ_can.jpg"
        },
        {
            name: "Dos Equis",
            img: "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f2/Dos_Equis_logo.svg/150px-Dos_Equis_logo.svg.png"
        },
        {
            name: "Blue Moon",
            img: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8b/Blue_Moon_Brewing_Company_logo.svg/120px-Blue_Moon_Brewing_Company_logo.svg.png"
        },
        {
            name: "Stella Artois",
            img: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8c/Stella_Artois_logo.svg/150px-Stella_Artois_logo.svg.png"
        },
        {
            name: "Guinness",
            img: "https://upload.wikimedia.org/wikipedia/en/thumb/f/fe/Guinness_logo.svg/120px-Guinness_logo.svg.png"
        },
        {
            name: "Yuengling",
            img: "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6c/Yuengling_logo.svg/150px-Yuengling_logo.svg.png"
        },
        {
            name: "Pabst Blue Ribbon",
            img: "https://upload.wikimedia.org/wikipedia/commons/thumb/7/71/PBR_Logo.svg/120px-PBR_Logo.svg.png"
        },
        {
            name: "Sam Adams",
            img: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/ca/Samuel_Adams_%28beer%29_logo.svg/150px-Samuel_Adams_%28beer%29_logo.svg.png"
        },
        {
            name: "Miller High Life",
            img: "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/Miller_High_Life_logo.svg/120px-Miller_High_Life_logo.svg.png"
        },
        {
            name: "Keystone Light",
            img: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/51/Keystone_Light_Logo.svg/150px-Keystone_Light_Logo.svg.png"
        },
        {
            name: "Coors Banquet",
            img: "https://upload.wikimedia.org/wikipedia/commons/thumb/9/95/Coors_Banquet_logo.svg/150px-Coors_Banquet_logo.svg.png"
        }
    ];

    let untriedBeers = new Set();
    let rankedBeers = [];
    let totalComparisons = 0;
    let completedComparisons = 0;

    // Estimate total comparisons for merge sort: n * ceil(log2(n))
    function estimateComparisons(n) {
        if (n <= 1) return 0;
        return n * Math.ceil(Math.log2(n));
    }

    function updateProgress() {
        const pct = totalComparisons > 0 ? Math.min(Math.round((completedComparisons / totalComparisons) * 100), 100) : 0;
        document.getElementById('progressBar').style.width = pct + '%';
        document.getElementById('progressText').textContent =
            completedComparisons + ' of ~' + totalComparisons + ' comparisons (' + pct + '%)';
    }

    function getBeerByName(name) {
        return beers.find(b => b.name === name);
    }

    // Create a fallback element for when images fail to load
    function createBeerImg(src, alt, cssClass) {
        const img = document.createElement('img');
        img.src = src;
        img.alt = alt;
        img.loading = 'lazy';
        img.onerror = function() {
            const fallback = document.createElement('div');
            fallback.className = cssClass || 'beer-emoji-fallback';
            fallback.textContent = BEER_EMOJI;
            fallback.setAttribute('role', 'img');
            fallback.setAttribute('aria-label', alt);
            this.parentNode.replaceChild(fallback, this);
        };
        return img;
    }

    function generateSelectionForm() {
        const form = document.getElementById('beerSelectionForm');
        const sortedBeers = beers.slice().sort((a, b) => a.name.localeCompare(b.name));

        sortedBeers.forEach((beer, index) => {
            const label = document.createElement('label');
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.value = beer.name;
            checkbox.id = `beer-${index}`;

            const img = createBeerImg(beer.img, beer.name, 'beer-emoji-fallback');

            const span = document.createElement('span');
            span.textContent = beer.name;

            label.appendChild(checkbox);
            label.appendChild(img);
            label.appendChild(span);
            form.appendChild(label);
        });
    }

    function startRanking() {
        untriedBeers.clear();
        rankedBeers = [];
        completedComparisons = 0;

        const checkboxes = document.querySelectorAll('#beerSelectionForm input[type="checkbox"]');
        checkboxes.forEach(checkbox => {
            if (checkbox.checked) {
                untriedBeers.add(checkbox.value);
            }
        });

        const remainingBeers = beers.map(b => b.name).filter(name => !untriedBeers.has(name));
        totalComparisons = estimateComparisons(remainingBeers.length);

        document.querySelector('.selection-section').style.display = 'none';
        document.getElementById('introMessage').style.display = 'none';
        document.getElementById('pairwiseContainer').style.display = 'block';
        document.getElementById('progressContainer').style.display = 'block';
        updateProgress();

        rankBeers(remainingBeers);
    }

    function rankBeers(beerList) {
        if (beerList.length <= 1) {
            rankedBeers.push(...beerList);
            displayRanking();
            return;
        }

        mergeSort(beerList, sortedList => {
            rankedBeers = sortedList;
            displayRanking();
        });
    }

    function mergeSort(beerNames, callback) {
        if (beerNames.length <= 1) {
            callback(beerNames);
            return;
        }

        const mid = Math.floor(beerNames.length / 2);
        const left = beerNames.slice(0, mid);
        const right = beerNames.slice(mid);

        mergeSort(left, sortedLeft => {
            mergeSort(right, sortedRight => {
                merge(sortedLeft, sortedRight, callback);
            });
        });
    }

    function merge(left, right, callback) {
        let i = 0, j = 0;
        const sortedList = [];

        function compareNext() {
            if (i < left.length && j < right.length) {
                displayPair([left[i], right[j]], winner => {
                    if (winner === left[i]) {
                        sortedList.push(left[i]);
                        i++;
                    } else {
                        sortedList.push(right[j]);
                        j++;
                    }
                    completedComparisons++;
                    updateProgress();
                    compareNext();
                });
            } else {
                while (i < left.length) sortedList.push(left[i++]);
                while (j < right.length) sortedList.push(right[j++]);
                callback(sortedList);
            }
        }

        compareNext();
    }

    function displayPair(pair, callback) {
        const container = document.getElementById("pairwiseContainer");
        container.innerHTML = "";

        const heading = document.createElement("p");
        heading.innerHTML = "<strong>Which do you prefer?</strong>";
        heading.style.textAlign = "center";
        container.appendChild(heading);

        const pairElement = document.createElement("div");
        pairElement.classList.add("pair");

        const beer1 = getBeerByName(pair[0]);
        const beer2 = getBeerByName(pair[1]);

        const button1 = document.createElement("button");
        button1.classList.add("pair-button");
        const img1 = createBeerImg(beer1 ? beer1.img : "", pair[0], 'beer-emoji-fallback-lg');
        button1.appendChild(img1);
        button1.appendChild(document.createTextNode(pair[0]));
        button1.onclick = () => callback(pair[0]);

        const vs = document.createElement("div");
        vs.classList.add("pair-vs");
        vs.textContent = "vs";

        const button2 = document.createElement("button");
        button2.classList.add("pair-button");
        const img2 = createBeerImg(beer2 ? beer2.img : "", pair[1], 'beer-emoji-fallback-lg');
        button2.appendChild(img2);
        button2.appendChild(document.createTextNode(pair[1]));
        button2.onclick = () => callback(pair[1]);

        pairElement.appendChild(button1);
        pairElement.appendChild(vs);
        pairElement.appendChild(button2);
        container.appendChild(pairElement);
    }

    function displayRanking() {
        // Complete the progress bar
        completedComparisons = totalComparisons;
        updateProgress();

        document.getElementById("pairwiseContainer").style.display = "none";
        document.getElementById("progressContainer").style.display = "none";
        document.getElementById("finalRankingHeading").style.display = 'block';

        const rankingList = document.getElementById("beers");
        rankingList.innerHTML = "";

        rankedBeers.forEach((beerName, index) => {
            const beer = getBeerByName(beerName);
            const listItem = document.createElement("li");

            const rankSpan = document.createElement("span");
            rankSpan.classList.add("rank-number");
            rankSpan.textContent = `#${index + 1}`;

            const img = createBeerImg(beer ? beer.img : "", beerName, 'beer-emoji-fallback');

            const nameSpan = document.createElement("span");
            nameSpan.textContent = beerName;

            listItem.appendChild(rankSpan);
            listItem.appendChild(img);
            listItem.appendChild(nameSpan);
            rankingList.appendChild(listItem);
        });

        displayOmittedBeers();
        document.getElementById("restartButton").style.display = 'inline-block';
        document.getElementById("shareButton").style.display = 'inline-block';
    }

    function displayOmittedBeers() {
        const omittedList = document.getElementById("omittedList");
        omittedList.innerHTML = "";

        if (untriedBeers.size === 0) {
            document.getElementById("omittedBeers").style.display = 'none';
            return;
        }

        untriedBeers.forEach(beer => {
            const listItem = document.createElement("li");
            listItem.innerText = beer;
            omittedList.appendChild(listItem);
        });

        document.getElementById("omittedBeers").style.display = 'block';
    }

    function getRankingsText() {
        let text = "My Beer Rankings:\n";
        rankedBeers.forEach((beer, index) => {
            text += `${index + 1}. ${beer}\n`;
        });
        text += "\nRank your own beers at this site!";
        return text;
    }

    function copyRankings() {
        const text = getRankingsText();
        navigator.clipboard.writeText(text).then(() => {
            const confirm = document.getElementById('copyConfirm');
            confirm.style.display = 'block';
            setTimeout(() => { confirm.style.display = 'none'; }, 2000);
        });
    }

    function shareTwitter() {
        const top3 = rankedBeers.slice(0, 3).map((b, i) => `${i + 1}. ${b}`).join(', ');
        const text = encodeURIComponent(`My top 3 beers: ${top3} - Rank yours!`);
        window.open(`https://twitter.com/intent/tweet?text=${text}`, '_blank');
    }

    function shareFacebook() {
        const text = encodeURIComponent(`My top beer is ${rankedBeers[0]}! What's yours?`);
        window.open(`https://www.facebook.com/sharer/sharer.php?quote=${text}`, '_blank');
    }

    function shareSMS() {
        const text = encodeURIComponent(getRankingsText());
        window.open(`sms:?body=${text}`, '_blank');
    }

    function openShareModal() {
        document.getElementById('shareModal').classList.add('active');
    }

    function closeShareModal() {
        document.getElementById('shareModal').classList.remove('active');
    }

    function restart() {
        location.reload();
    }

    document.getElementById('startRanking').addEventListener('click', startRanking);
    document.getElementById('restartButton').addEventListener('click', restart);
    document.getElementById('shareButton').addEventListener('click', openShareModal);

    // Close modal on background click
    document.getElementById('shareModal').addEventListener('click', function(e) {
        if (e.target === this) closeShareModal();
    });

    generateSelectionForm();
</script>
</body>
</html>
